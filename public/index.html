<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087443">
<title>ObuasiGo — Food, Delivery & Hotels</title>
<style>
:root{--green:#087443;--gold:#f3a11b;--dark:#10231a;--muted:#6d7b74;--bg:#f5f7f6;--line:#e7ece9}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--dark)}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:12px;position:sticky;top:0;z-index:20}
.brand{font-weight:900;font-size:22px;color:var(--green);margin-right:auto}
.brand span{color:var(--gold)}
.pill{background:#edf7f1;color:var(--green);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:700}
.icon{width:40px;height:40px;border-radius:12px;background:#f1f5f3;font-size:18px}
.wrap{max-width:1100px;margin:auto;padding:20px 16px 130px}
.hero{background:linear-gradient(135deg,#087443,#0b8c52);color:#fff;border-radius:24px;padding:26px;display:grid;grid-template-columns:1.5fr .8fr;gap:20px}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.05;margin:8px 0}
.hero p{color:#dff5e9}
.hero-art{display:flex;align-items:center;justify-content:center;font-size:100px}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#edf7f1;color:var(--green);font-size:12px;font-weight:800}
.badge.gold{background:#fff4e0;color:#a86a00}
.badge.red{background:#fdecec;color:#b02a2a}
.section{margin-top:26px}
.section h2{margin:0 0 12px}
.muted{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 15px #00000008}
.food-img{height:110px;border-radius:14px;background:linear-gradient(135deg,#ffe7bd,#fff5e6);display:flex;align-items:center;justify-content:center;font-size:52px;margin-bottom:10px}
.price{font-weight:900;font-size:17px;margin:8px 0}
.btn{padding:11px 14px;border-radius:11px;font-weight:800;border:0;cursor:pointer;font-size:14px}
.primary{background:var(--green);color:#fff}
.secondary{background:#edf3ef;color:var(--green)}
.danger{background:#fdecec;color:#b02a2a}
.wide{width:100%}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.input{width:100%;padding:12px;border:1px solid #dce4df;border-radius:11px;margin:6px 0 12px;outline:0;font:inherit;background:#fff}
.input:focus{border-color:var(--green)}
label{font-size:13px;font-weight:700;color:#374b41;display:block;margin-top:6px}
.cart-fab{position:fixed;right:16px;bottom:90px;width:62px;height:62px;border-radius:50%;background:var(--green);color:#fff;font-size:26px;box-shadow:0 14px 34px #08744355;z-index:40;display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .18s}
.cart-fab.visible{transform:scale(1)}
.cart-fab.bump{transform:scale(1.18)}
.cart-fab .cbadge{position:absolute;top:-4px;right:-4px;background:var(--gold);color:#10231a;font-size:12px;font-weight:900;min-width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 6px;border:3px solid #fff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:25}
.bottom button{background:#fff;padding:12px 22px;color:#63716a;font-size:12px;font-weight:800}
.bottom button.active{color:var(--green)}
.view{display:none}
.view.active{display:block}
.modal{position:fixed;inset:0;background:#0007;z-index:70;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:min(620px,100%);background:#fff;border-radius:24px 24px 0 0;padding:22px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 6px}
.close{float:right;background:#f0f3f1;width:36px;height:36px;border-radius:50%;border:0;font-size:18px;cursor:pointer}
.cart-line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-line .nm{flex:1;font-weight:700;font-size:15px}
.qty{display:flex;align-items:center;gap:8px;background:#f2f6f4;border-radius:999px;padding:5px 8px}
.qty button{background:#fff;width:28px;height:28px;border-radius:50%;font-weight:900;color:var(--green);border:0;font-size:15px}
.summary{background:#f6faf8;border-radius:14px;padding:14px;margin-top:12px}
.summary div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.summary .tot{font-weight:900;font-size:17px;border-top:1px solid #dbe7e0;margin-top:6px;padding-top:8px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#10231a;color:#fff;padding:12px 16px;border-radius:12px;z-index:120;display:none;max-width:90vw;text-align:center;font-weight:600;font-size:14px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.qrbox{text-align:center;padding:16px;background:#fff;border-radius:16px;border:1px solid var(--line)}
.qrbox img{width:min(260px,72vw);height:auto}
.code-pill{display:inline-block;font-family:monospace;font-size:20px;letter-spacing:5px;font-weight:900;background:#f2f6f4;border-radius:11px;padding:9px 14px;margin-top:10px}
@media(max-width:700px){.hero{grid-template-columns:1fr}.hero-art{display:none}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">Obuasi<span>Go</span></div>
  <div class="pill" id="account">Guest</div>
  <button class="icon" onclick="openAuth()">🔐</button>
</header>

<main class="wrap">
  <section id="view-home" class="view active">
    <div class="hero">
      <div>
        <span class="badge">OBUASI DELIVERY</span>
        <h1>Good food.<br>Fast delivery.</h1>
        <p>Discover local restaurants, shops and hotels around Obuasi.</p>
      </div>
      <div class="hero-art">🛵</div>
    </div>
    <div class="section"><h2>Popular near you</h2><div class="grid" id="restaurantGrid"></div></div>
    <div class="section"><h2>Hotels &amp; stays</h2><div class="grid" id="hotelGrid"></div></div>
  </section>

  <section id="view-orders" class="view">
    <div class="row"><h2>Your orders</h2><button class="btn secondary" onclick="loadOrders()">Refresh</button></div>
    <div id="ordersList"><div class="empty">Sign in to see your orders.</div></div>
  </section>

  <section id="view-bookings" class="view">
    <div class="row"><h2>Your stays</h2><button class="btn secondary" onclick="loadBookings()">Refresh</button></div>
    <div id="bookingsList"><div class="empty">Sign in to see your bookings.</div></div>
  </section>
</main>

<button class="cart-fab" id="cartFab" onclick="openCart()">🛒<span class="cbadge" id="cartCount">0</span></button>

<nav class="bottom">
  <button class="active" data-nav="home" onclick="showView('home',this)">⌂<br>Home</button>
  <button data-nav="orders" onclick="showView('orders',this)">🧾<br>Orders</button>
  <button data-nav="bookings" onclick="showView('bookings',this)">🏨<br>Stays</button>
  <button onclick="openAuth()">👤<br>Account</button>
</nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var state = {
  token: localStorage.getItem('obg_token') || '',
  user: null,
  catalog: { restaurants: [], hotels: [] },
  cart: JSON.parse(localStorage.getItem('obg_cart') || '[]'),
  orders: [], bookings: []
};
var DELIVERY_FEE = 8;
var _orderPoll = null;

function money(n){ return 'GH\u20B5' + Number(n || 0).toFixed(2); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}
function toast(m, ms){
  var t = $('toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(function(){ t.style.display = 'none'; }, ms || 2400);
}
function closeSheet(){ $('modal').classList.remove('show'); }
$('modal').addEventListener('click', function(e){ if (e.target.id === 'modal') closeSheet(); });

function authHeaders(){ return state.token ? { Authorization: 'Bearer ' + state.token } : {}; }
async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type':'application/json' }, authHeaders(), opts.headers || {});
  var r = await fetch('/api' + path, opts);
  var d = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

function showView(name, btn){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.toggle('active', v.id === 'view-' + name); });
  document.querySelectorAll('.bottom button[data-nav]').forEach(function(b){ b.classList.toggle('active', b.dataset.nav === name); });
  if (name === 'orders') loadOrders();
  if (name === 'bookings') loadBookings();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openAuth(){
  $('modal').classList.add('show');
  $('sheet').innerHTML =
    '<button class="close" onclick="closeSheet()">×</button>'
    + '<h2>Sign in to ObuasiGo</h2>'
    + '<p class="muted">We send a one-time code to your phone.</p>'
    + '<label>Phone number</label>'
    + '<input class="input" id="authPhone" placeholder="+233241234567" value="' + esc(state.user ? state.user.phone : '') + '">'
    + '<button class="btn primary wide" id="authSend" onclick="sendOtp()">Send code</button>'
    + '<div id="otpStep" style="display:none;margin-top:14px">'
    + '<label>6-digit code</label>'
    + '<input class="input" id="authCode" maxlength="6" placeholder="123456" inputmode="numeric">'
    + '<button class="btn primary wide" onclick="verifyOtp()">Verify &amp; sign in</button>'
    + '</div>';
}

async function sendOtp(){
  var phone = $('authPhone').value.trim();
  $('authSend').disabled = true;
  try {
    var d = await api('/auth/request-otp', { method:'POST', body: JSON.stringify({ phone: phone }) });
    $('otpStep').style.display = 'block';
    if (d.devOtp){ $('authCode').value = d.devOtp; toast('Dev OTP: ' + d.devOtp, 6000); }
    else toast('Code sent to ' + phone);
  } catch(e){ toast(e.message); }
  $('authSend').disabled = false;
}

async function verifyOtp(){
  var phone = $('authPhone').value.trim();
  var code = $('authCode').value.trim();
  try {
    var d = await api('/auth/verify-otp', { method:'POST', body: JSON.stringify({ phone: phone, code: code }) });
    state.token = d.token; state.user = d.user;
    localStorage.setItem('obg_token', d.token);
    closeSheet(); renderAccount();
    toast('Welcome ' + (d.user.full_name || d.user.phone));
    loadOrders(); loadBookings(); startOrderPolling();
  } catch(e){ toast(e.message); }
}

function signOut(){
  state.token = ''; state.user = null;
  if (_orderPoll) clearInterval(_orderPoll);
  localStorage.removeItem('obg_token');
  renderAccount();
  $('ordersList').innerHTML = '<div class="empty">Sign in to see your orders.</div>';
  $('bookingsList').innerHTML = '<div class="empty">Sign in to see your bookings.</div>';
  toast('Signed out');
}

function renderAccount(){
  var u = state.user;
  $('account').textContent = u ? (u.full_name || u.phone) : 'Guest';
}

async function loadMe(){
  if (!state.token){ renderAccount(); return; }
  try { var d = await api('/me'); state.user = d.user; }
  catch(e){ state.token = ''; localStorage.removeItem('obg_token'); }
  renderAccount();
}

async function loadCatalog(){
  state.catalog = await api('/catalog');
  $('restaurantGrid').innerHTML = state.catalog.restaurants.map(function(r){
    return '<article class="card">'
      + '<div class="food-img">' + r.emoji + '</div>'
      + '<b>' + esc(r.name) + '</b>'
      + '<p class="muted">' + esc(r.tags) + ' · ' + esc(r.eta) + '</p>'
      + '<div class="price">From ' + money(Math.min.apply(null, r.items.map(function(i){ return i.price; }))) + '</div>'
      + '<button class="btn primary wide" onclick="openRestaurant(\'' + r.id + '\')">View menu</button>'
      + '</article>';
  }).join('');
  $('hotelGrid').innerHTML = state.catalog.hotels.map(function(h){
    return '<article class="card">'
      + '<div class="food-img">🏨</div>'
      + '<b>' + esc(h.name) + '</b>'
      + '<p class="muted">' + esc(h.room) + ' · ' + esc(h.perks) + '</p>'
      + '<div class="price">' + money(h.price) + '/night</div>'
      + '<button class="btn primary wide" onclick="openBooking(\'' + h.id + '\')">Book room</button>'
      + '</article>';
  }).join('');
}

function openRestaurant(id){
  var r = state.catalog.restaurants.filter(function(x){ return x.id === id; })[0];
  if (!r) return;
  $('modal').classList.add('show');
  $('sheet').innerHTML =
    '<button class="close" onclick="closeSheet()">×</button>'
    + '<div class="row"><div><h2 style="margin:0">' + esc(r.name) + '</h2><p class="muted">' + esc(r.tags) + ' · ' + esc(r.eta) + '</p></div><div style="font-size:42px">' + r.emoji + '</div></div>'
    + '<div style="margin-top:10px">'
    + r.items.map(function(i){
        return '<div class="cart-line">'
          + '<div style="width:48px;height:48px;border-radius:12px;background:#fff5e6;display:flex;align-items:center;justify-content:center;font-size:24px">' + i.emoji + '</div>'
          + '<div class="nm">' + esc(i.name) + '<div class="muted">' + money(i.price) + '</div></div>'
          + '<button class="btn primary" onclick="addToCart(\'' + esc(r.name) + '\',\'' + i.id + '\',\'' + esc(i.name) + '\',' + i.price + ',\'' + i.emoji + '\')">+ Add</button>'
          + '</div>';
      }).join('')
    + '</div>'
    + '<button class="btn primary wide" style="margin-top:16px" onclick="openCart()">Open cart · ' + cartCount() + ' item(s)</button>';
}

function cartCount(){ return state.cart.reduce(function(n, l){ return n + l.qty; }, 0); }
function cartSubtotal(){ return state.cart.reduce(function(n, l){ return n + l.qty * l.price; }, 0); }
function saveCart(){ localStorage.setItem('obg_cart', JSON.stringify(state.cart)); renderCart(); }
function renderCart(){
  var n = cartCount();
  $('cartCount').textContent = n;
  $('cartFab').classList.toggle('visible', n > 0);
}
function addToCart(vendor, itemId, name, price, emoji){
  var line = null;
  for (var i = 0; i < state.cart.length; i++) if (state.cart[i].vendor === vendor && state.cart[i].itemId === itemId) line = state.cart[i];
  if (line) line.qty++;
  else state.cart.push({ vendor: vendor, itemId: itemId, name: name, price: price, emoji: emoji, qty: 1 });
  saveCart();
  var f = $('cartFab'); f.classList.add('bump'); setTimeout(function(){ f.classList.remove('bump'); }, 180);
  toast(name + ' added to cart');
}
function changeQty(i, d){
  var l = state.cart[i]; if (!l) return;
  l.qty += d;
  if (l.qty <= 0) state.cart.splice(i, 1);
  saveCart();
  if (state.cart.length) openCart(); else closeSheet();
}
function clearCart(){ state.cart = []; saveCart(); closeSheet(); toast('Cart cleared'); }

function openCart(){
  if (!state.cart.length){ toast('Your cart is empty'); return; }
  var vendors = [];
  state.cart.forEach(function(l){ if (vendors.indexOf(l.vendor) === -1) vendors.push(l.vendor); });
  var sub = cartSubtotal();
  var fee = DELIVERY_FEE * vendors.length;
  $('modal').classList.add('show');
  $('sheet').innerHTML =
    '<button class="close" onclick="closeSheet()">×</button>'
    + '<h2>Your cart</h2>'
    + '<p class="muted">' + (vendors.length > 1 ? vendors.length + ' vendors' : esc(vendors[0])) + '</p>'
    + state.cart.map(function(l, i){
        return '<div class="cart-line">'
          + '<div style="width:44px;height:44px;border-radius:12px;background:#fff5e6;display:flex;align-items:center;justify-content:center;font-size:22px">' + (l.emoji || '🍽️') + '</div>'
          + '<div class="nm">' + esc(l.name) + '<div class="muted">' + money(l.price) + '</div></div>'
          + '<div class="qty"><button onclick="changeQty(' + i + ',-1)">−</button><b>' + l.qty + '</b><button onclick="changeQty(' + i + ',1)">+</button></div>'
          + '</div>';
      }).join('')
    + '<div class="summary">'
    + '<div><span>Subtotal</span><b>' + money(sub) + '</b></div>'
    + '<div><span>Delivery</span><b>' + money(fee) + '</b></div>'
    + '<div class="tot"><span>Total</span><span>' + money(sub + fee) + '</span></div>'
    + '</div>'
    + '<label>Delivery address</label>'
    + '<input class="input" id="cartAddr" placeholder="e.g. Ahinsan Estate, House 12, Obuasi">'
    + '<label>Note for rider</label>'
    + '<input class="input" id="cartNote" placeholder="Call when you arrive">'
    + '<button class="btn primary wide" onclick="placeOrder()">Place order · ' + money(sub + fee) + '</button>'
    + '<button class="btn danger wide" style="margin-top:8px" onclick="clearCart()">Clear cart</button>';
}

async function placeOrder(){
  if (!state.token){ closeSheet(); openAuth(); toast('Sign in to place order'); return; }
  var addr = ($('cartAddr').value || '').trim();
  if (!addr) { toast('Add delivery address'); return; }
  var note = ($('cartNote').value || '').trim();
  var byVendor = {};
  state.cart.forEach(function(l){ if (!byVendor[l.vendor]) byVendor[l.vendor] = []; byVendor[l.vendor].push(l); });
  try {
    var created = [];
    var vendors = Object.keys(byVendor);
    for (var i = 0; i < vendors.length; i++) {
      var vendor = vendors[i];
      var lines = byVendor[vendor];
      var total = lines.reduce(function(n, l){ return n + l.qty * l.price; }, 0) + DELIVERY_FEE;
      var order = await api('/orders', {
        method: 'POST',
        body: JSON.stringify({
          vendor: vendor,
          items: lines.map(function(l){ return { id: l.itemId, name: l.name, price: l.price, qty: l.qty }; }),
          total: total,
          deliveryFee: DELIVERY_FEE,
          deliveryAddress: { text: addr },
          note: note
        })
      });
      created.push(order);
    }
    state.cart = []; saveCart(); closeSheet();
    showPayment(created[0]);
  } catch(e){ toast(e.message); }
}

function showPayment(order){
  $('modal').classList.add('show');
  $('sheet').innerHTML =
    '<button class="close" onclick="closeSheet()">×</button>'
    + '<h2>Complete payment</h2>'
    + '<p class="muted">Order #' + order.id + ' · ' + esc(order.vendor) + '</p>'
    + '<div style="background:#f6faf8;border-radius:14px;padding:16px;margin:14px 0">'
    + '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>Subtotal</span><b>' + money(order.total - 8) + '</b></div>'
    + '<div style="display:flex;justify-content:space-between;padding:4px 0"><span>Delivery</span><b>' + money(8) + '</b></div>'
    + '<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #dbe7e0;margin-top:6px;font-size:17px;font-weight:900"><span>Total</span><span>' + money(order.total) + '</span></div>'
    + '</div>'
    + '<button class="btn primary wide" style="margin-bottom:8px" onclick="payNow(\'' + order.id + '\')">💳 Pay ' + money(order.total) + ' now</button>'
    + '<button class="btn secondary wide" onclick="payCash(\'' + order.id + '\')">💵 Cash on delivery</button>'
    + '<button class="btn danger wide" style="margin-top:8px" onclick="closeSheet(); showView(\'orders\')">Pay later from Orders tab</button>';
}

async function payNow(id){
  try {
    await api('/orders/' + id + '/pay', { method:'POST' });
    toast('Payment confirmed 🎉 Vendor notified');
    closeSheet(); showView('orders'); loadOrders();
  } catch(e){ toast(e.message); }
}
async function payCash(id){
  try {
    await api('/orders/' + id + '/pay', { method:'POST' });
    toast('Order sent (pay on delivery)');
    closeSheet(); showView('orders'); loadOrders();
  } catch(e){ toast(e.message); }
}

async function cancelOrder(id){
  if (!confirm('Cancel this order?')) return;
  try {
    await api('/orders/' + id + '/cancel', { method:'POST' });
    toast('Order cancelled');
    loadOrders();
  } catch(e){ toast(e.message); }
}

function startOrderPolling(){
  if (_orderPoll) clearInterval(_orderPoll);
  _orderPoll = setInterval(function(){
    if (!state.token) return;
    if ($('view-orders').classList.contains('active')) loadOrders();
  }, 4000);
}

async function loadOrders(){
  if (!state.token) return;
  try {
    var prev = state.orders.map(function(o){ return o.id + ':' + o.status; }).join(',');
    state.orders = await api('/orders');
    var now = state.orders.map(function(o){ return o.id + ':' + o.status; }).join(',');
    if (prev && prev !== now) toast('📢 Order status updated');
    
    if (!state.orders.length){ $('ordersList').innerHTML = '<div class="empty">No orders yet.</div>'; return; }
    
    var STEPS = ['Order created','Payment confirmed','Restaurant accepted','Preparing','Food ready','Rider assigned','Rider accepted','Rider arrived','Food picked up','Going to customer','Arrived at customer','Customer PIN verified','Completed'];
    
    $('ordersList').innerHTML = state.orders.map(function(o){
      var canPay = o.status === 'Order created';
      var canCancel = ['Order created','Payment confirmed','Restaurant accepted','Preparing'].indexOf(o.status) !== -1;
      var isCancelled = o.status === 'Cancelled by customer' || o.status === 'Rejected by vendor';
      var statusColor = o.status === 'Completed' ? '' : (isCancelled ? 'red' : 'gold');
      var currentIdx = STEPS.indexOf(o.status);
      
      var buttons = '';
      if (canPay){
        buttons += '<button class="btn primary wide" style="margin-top:10px" onclick="payNow(\'' + o.id + '\')">💳 Pay ' + money(o.total) + ' now</button>';
        buttons += '<button class="btn secondary wide" style="margin-top:6px" onclick="payCash(\'' + o.id + '\')">💵 Cash on delivery</button>';
      }
      if (canCancel){
        buttons += '<button class="btn danger wide" style="margin-top:6px" onclick="cancelOrder(\'' + o.id + '\')">✕ Cancel order</button>';
      }
      
      var pinBox = (!isCancelled && o.status !== 'Completed' && o.delivery_pin)
        ? '<div class="summary" style="text-align:center"><div style="display:block"><span>Give this PIN to your rider when they arrive</span><div style="font-size:26px;letter-spacing:6px;font-weight:900;margin-top:4px">' + esc(o.delivery_pin) + '</div></div></div>'
        : '';
      
      var timeline = '<div style="border-left:2px solid #cde5d8;margin:12px 0 0;padding-left:14px">'
        + ['Order created','Payment confirmed','Restaurant accepted','Food ready','Rider accepted','Food picked up','Arrived at customer','Completed'].map(function(label){
            var stepIdx = STEPS.indexOf(label);
            var done = stepIdx !== -1 && currentIdx !== -1 && stepIdx <= currentIdx;
            return '<div style="padding:5px 0;color:' + (done ? '#087443' : '#9ab7aa') + ';font-weight:700;font-size:13px">' + (done ? '✓ ' : '○ ') + label + '</div>';
          }).join('')
        + '</div>';
      
      return '<div class="card" style="margin-bottom:14px">'
        + '<div class="row">'
        + '<div><span class="badge ' + statusColor + '">' + esc(o.status) + '</span>'
        + '<h3 style="margin:8px 0 2px">#' + esc(o.id) + '</h3>'
        + '<p class="muted">' + esc(o.vendor) + ' · ' + o.items.reduce(function(n, i){ return n + i.qty; }, 0) + ' item(s)</p></div>'
        + '<div class="price">' + money(o.total) + '</div>'
        + '</div>'
        + pinBox
        + timeline
        + buttons
        + '</div>';
    }).join('');
  } catch(e){ $('ordersList').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}

function openBooking(hotelId){
  var h = state.catalog.hotels.filter(function(x){ return x.id === hotelId; })[0];
  if (!h) return;
  var today = new Date().toISOString().slice(0, 10);
  var tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  $('modal').classList.add('show');
  $('sheet').innerHTML =
    '<button class="close" onclick="closeSheet()">×</button>'
    + '<h2>Book ' + esc(h.name) + '</h2>'
    + '<p class="muted">' + esc(h.room) + ' · ' + money(h.price) + '/night</p>'
    + '<label>Check-in</label><input class="input" type="date" id="bkIn" value="' + today + '">'
    + '<label>Check-out</label><input class="input" type="date" id="bkOut" value="' + tomorrow + '">'
    + '<label>Guests</label><select class="input" id="bkGuests"><option>1</option><option>2</option><option>3</option><option>4</option></select>'
    + '<button class="btn primary wide" onclick="createBooking(\'' + h.id + '\')">Confirm booking</button>';
}

async function createBooking(hotelId){
  if (!state.token){ closeSheet(); openAuth(); toast('Sign in to book'); return; }
  var h = state.catalog.hotels.filter(function(x){ return x.id === hotelId; })[0];
  var ci = $('bkIn').value, co = $('bkOut').value, guests = Number($('bkGuests').value || 1);
  if (!ci || !co){ toast('Choose your dates'); return; }
  var nights = Math.max(1, Math.round((new Date(co) - new Date(ci)) / 86400000));
  try {
    await api('/bookings', { method:'POST', body: JSON.stringify({ hotel: h.name, room: h.room, checkIn: ci, checkOut: co, guests: guests, total: h.price * nights }) });
    closeSheet(); toast('Booking confirmed 🎉');
    showView('bookings'); loadBookings();
  } catch(e){ toast(e.message); }
}

async function loadBookings(){
  if (!state.token) return;
  try {
    state.bookings = await api('/bookings');
    if (!state.bookings.length){ $('bookingsList').innerHTML = '<div class="empty">No bookings yet.</div>'; return; }
    $('bookingsList').innerHTML = state.bookings.map(function(b){
      return '<div class="card" style="margin-bottom:14px">'
        + '<div class="row"><div>'
        + '<span class="badge ' + (b.status === 'CHECKED IN' ? '' : 'gold') + '">' + esc(b.status) + '</span>'
        + '<h3 style="margin:8px 0 2px">' + esc(b.hotel) + '</h3>'
        + '<p class="muted">' + esc(b.room) + ' · ' + b.guests + ' guest(s) · ' + esc(b.check_in || '') + ' → ' + esc(b.check_out || '') + '</p>'
        + '</div><div class="price">' + money(b.total) + '</div></div>'
        + '<button class="btn primary wide" style="margin-top:10px" onclick="showBookingQr(\'' + b.id + '\')">Show check-in QR</button>'
        + '</div>';
    }).join('');
  } catch(e){ $('bookingsList').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
}

async function showBookingQr(id){
  $('modal').classList.add('show');
  $('sheet').innerHTML = '<button class="close" onclick="closeSheet()">×</button><h2>Check-in code</h2><div class="empty">Generating…</div>';
  try {
    var d = await api('/bookings/' + id + '/qr');
    $('sheet').innerHTML =
      '<button class="close" onclick="closeSheet()">×</button>'
      + '<h2>Hotel check-in</h2>'
      + '<p class="muted">Show this to reception.</p>'
      + '<div class="qrbox"><img src="' + d.png + '" alt="QR">'
      + '<div class="code-pill">' + esc(d.code) + '</div>'
      + '<p class="muted" style="margin-top:8px">Or read the code aloud.</p></div>';
  } catch(e){
    $('sheet').innerHTML = '<button class="close" onclick="closeSheet()">×</button><div class="empty">' + esc(e.message) + '</div>';
  }
}

renderCart();
loadMe();
loadCatalog().catch(function(){ toast('Could not load catalog'); });
if (state.token){ loadOrders(); loadBookings(); startOrderPolling(); }
</script>
<script src="/menu.js"></script>
</body>
</html>
