<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B5E3D">
<title>ObuasiGo</title>
<style>
:root{--primary:#0B5E3D;--primary-dark:#08422B;--gold:#D4AF37;--bg:#F4F7F5;--card:#fff;--text:#1A1A1A;--muted:#6B7A72;--line:#E2E8E4;--red:#D93025;--green-light:#E6F4EC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:480px;margin:auto;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative}
.header{background:var(--primary);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:-0.5px;cursor:pointer}
.logo span{color:var(--gold)}
.logo-icon{width:32px;height:32px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px}
.header-right{display:flex;align-items:center;gap:8px}
.who{background:rgba(255,255,255,.15);color:#fff;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role-select{background:rgba(255,255,255,.15);color:#fff;border:0;padding:7px 10px;border-radius:20px;font-size:11px;font-weight:700;outline:0}
.main{flex:1;padding:18px 14px 100px;overflow-y:auto}
.view{display:none}
.view.active{display:block}
h2{font-size:19px;margin:0 0 12px}
h3{font-size:15px;margin:16px 0 10px}
.muted{color:var(--muted);font-size:13px}
.banner{background:linear-gradient(135deg,var(--primary),#1A7A50);color:#fff;border-radius:18px;padding:18px;margin-bottom:18px;position:relative;overflow:hidden}
.banner h3{margin:0;font-size:17px;color:#fff}
.banner p{margin:6px 0 0;font-size:12.5px;color:#d0e8db;line-height:1.4}
.banner-icon{position:absolute;right:12px;bottom:8px;font-size:54px;opacity:0.2}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.cat{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.cat .em{font-size:22px;display:block;margin-bottom:4px}
.cat span{font-size:10px;font-weight:700;color:var(--text)}
.cards-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cards-scroll::-webkit-scrollbar{display:none}
.card{background:var(--card);border-radius:16px;overflow:hidden;min-width:190px;max-width:190px;box-shadow:0 3px 12px rgba(0,0,0,.05)}
.card-img{height:100px;background:#E8F0EA;display:flex;align-items:center;justify-content:center;font-size:40px}
.card-body{padding:11px}
.card-body b{display:block;font-size:13.5px;margin-bottom:3px}
.stars{color:var(--gold);font-size:11.5px;margin-bottom:5px;display:flex;align-items:center;gap:3px}
.stars small{color:var(--muted);font-weight:400}
.price-tag{font-weight:800;font-size:14px;color:var(--primary)}
.card-btn{background:var(--primary);color:#fff;border:0;width:100%;padding:8px;border-radius:9px;font-weight:700;font-size:12px;margin-top:6px;cursor:pointer}
.cart-item{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px;border-radius:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.cart-item .em{width:48px;height:48px;border-radius:12px;background:#FFF5E6;display:flex;align-items:center;justify-content:center;font-size:22px}
.cart-item .info{flex:1;min-width:0}
.cart-item .info b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item .info span{font-size:11.5px;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900;color:var(--primary);cursor:pointer;font-size:14px}
.summary{background:var(--card);border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.summary-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}
.summary-total{display:flex;justify-content:space-between;padding:10px 0 0;border-top:1px solid var(--line);margin-top:4px;font-weight:900;font-size:16px}
.btn{background:var(--primary);color:#fff;border:0;padding:13px;border-radius:12px;font-weight:800;font-size:14px;width:100%;cursor:pointer;margin-top:12px}
.btn.secondary{background:var(--green-light);color:var(--primary)}
.btn.danger{background:#FDECEC;color:var(--red)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.metric{background:var(--card);border-radius:12px;padding:12px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.metric b{display:block;font-size:17px;font-weight:900;color:var(--primary);margin-bottom:1px}
.metric span{font-size:10px;color:var(--muted);font-weight:600}
.order-card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.order-head b{font-size:12px;color:var(--muted)}
.badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;background:#FFF4E0;color:#B8860B}
.badge.ready{background:var(--green-light);color:var(--primary)}
.badge.done{background:#F0F0F0;color:#888}
.badge.red{background:#FDECEC;color:var(--red)}
.badge.blue{background:#E0EEF7;color:#0C5A8A}
.order-item{font-size:13.5px;font-weight:700;margin-bottom:3px}
.order-price{font-size:13.5px;font-weight:900;color:var(--primary)}
.order-btns{display:flex;gap:6px;margin-top:8px}
.order-btns button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:12px;border:0;cursor:pointer}
.order-btns .accept{background:var(--primary);color:#fff}
.order-btns .reject{background:#FDECEC;color:var(--red)}
.order-btns .secondary{background:var(--green-light);color:var(--primary)}
.rider-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.switch{width:52px;height:28px;border-radius:20px;background:#ccc;padding:3px;border:0;cursor:pointer;transition:.2s}
.switch span{display:block;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--primary)}
.switch.on span{transform:translateX(24px)}
.chart-box{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.03)}
.chart-box canvas{width:100%;height:130px}
.admin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.admin-box{background:var(--card);border-radius:12px;padding:12px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.03);cursor:pointer}
.admin-box .em{font-size:22px;display:block;margin-bottom:5px}
.admin-box span{font-size:10px;font-weight:700}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:auto;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 0 12px;z-index:40}
.nav-item{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:700;color:var(--muted);cursor:pointer;width:58px;padding:4px 0}
.nav-item.active{color:var(--primary)}
.nav-item .em{font-size:19px}
.splash{position:fixed;inset:0;background:var(--primary);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s}
.splash.hide{opacity:0;pointer-events:none}
.splash-icon{width:84px;height:84px;background:rgba(255,255,255,.15);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:16px}
.splash h1{margin:0;font-size:30px;font-weight:900}
.splash h1 span{color:var(--gold)}
.splash p{margin:8px 0 0;font-size:12px;color:#B3D9C6;letter-spacing:1px}
.toast{position:fixed;bottom:105px;left:50%;transform:translateX(-50%);background:#10231A;color:#fff;padding:11px 16px;border-radius:11px;font-size:13px;font-weight:600;z-index:500;display:none;max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow-y:auto}
.sheet h2{margin:0 0 12px}
.sheet input,.sheet select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:14px;margin-bottom:10px;outline:0}
.sheet label{font-size:12.5px;font-weight:700;color:#374b41;display:block;margin-bottom:4px}
.close-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.close-btn{background:#f0f3f1;width:34px;height:34px;border-radius:50%;border:0;font-size:16px;cursor:pointer}
.qrbox{text-align:center;padding:14px;background:#fff;border-radius:14px;border:1px solid var(--line)}
.qrbox img{width:min(240px,68vw);height:auto}
.code-pill{display:inline-block;font-family:monospace;font-size:18px;letter-spacing:4px;font-weight:900;background:#f2f6f4;border-radius:10px;padding:8px 12px;margin-top:8px}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px}
</style>
</head>
<body>

<div id="splash" class="splash">
  <div class="splash-icon">🛵</div>
  <h1>Obuasi<span>Go</span></h1>
  <p>OBUASI AT YOUR FINGERTIPS</p>
</div>

<div class="app">
  <header class="header">
    <div class="logo" onclick="switchRole('customer')">
      <div class="logo-icon">🛵</div>
      Obuasi<span>Go</span>
    </div>
    <div class="header-right">
      <div class="who" id="who" onclick="openAuth()">Guest</div>
      <select class="role-select" id="roleSelect" onchange="switchRole(this.value)">
        <option value="customer">👤 Customer</option>
        <option value="vendor">🍽️ Vendor</option>
        <option value="rider">🛵 Rider</option>
        <option value="hotel">🏨 Hotel</option>
        <option value="admin">🛡️ Admin</option>
      </select>
    </div>
  </header>

  <main class="main" id="main">
    <!-- HOME -->
    <div id="view-home" class="view active">
      <div id="homeContent"></div>
    </div>

    <!-- CART / ORDERS / BOOKINGS / PROFILE / EARNINGS / USERS / etc. (dynamic) -->
    <div id="view-cart" class="view"><div id="cartContent"></div></div>
    <div id="view-orders" class="view"><div id="ordersContent"></div></div>
    <div id="view-bookings" class="view"><div id="bookingsContent"></div></div>
    <div id="view-profile" class="view"><div id="profileContent"></div></div>
    <div id="view-earnings" class="view"><div id="earningsContent"></div></div>
    <div id="view-deliveries" class="view"><div id="deliveriesContent"></div></div>
    <div id="view-menu" class="view"><div id="menuContent"></div></div>
    <div id="view-users" class="view"><div id="usersContent"></div></div>
    <div id="view-settings" class="view"><div id="settingsContent"></div></div>
    <div id="view-rooms" class="view"><div id="roomsContent"></div></div>
  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   INLINE FALLBACK DATA — used if /api/catalog fails
============================================================ */
var FALLBACK_CATALOG = {
  restaurants: [
    { id:'r1', name:'Obuasi Kitchen', emoji:'🍗', tags:'Jollof · Chicken', eta:'25-35 min', rating:4.5, orders:231,
      items:[{id:'i1',name:'Jollof + Chicken',price:38,emoji:'🍗'},{id:'i2',name:'Fried Rice + Beef',price:42,emoji:'🍛'},{id:'i3',name:'Chicken Wings (6pc)',price:30,emoji:'🍗'},{id:'i4',name:'Soft Drink',price:8,emoji:'🥤'}] },
    { id:'r2', name:'Pizza Hub Obuasi', emoji:'🍕', tags:'Pizza · Fast food', eta:'30-40 min', rating:4.8, orders:145,
      items:[{id:'i5',name:'Pepperoni Pizza',price:65,emoji:'🍕'},{id:'i6',name:'Margherita',price:55,emoji:'🍕'},{id:'i7',name:'Garlic Bread',price:20,emoji:'🥖'}] },
    { id:'r3', name:'Ashanti Chop Bar', emoji:'🥘', tags:'Local food', eta:'20-30 min', rating:4.2, orders:89,
      items:[{id:'i8',name:'Fufu + Light Soup',price:34,emoji:'🥘'},{id:'i9',name:'Banku + Tilapia',price:48,emoji:'🐟'},{id:'i10',name:'Waakye Special',price:32,emoji:'🍚'}] }
  ],
  hotels: [
    { id:'h1', name:'Obuasi Royal Hotel', room:'Executive Room', perks:'Wi-Fi · Breakfast', price:450, rating:4.3, stays:98 },
    { id:'h2', name:'Golden View Lodge', room:'Comfort Room', perks:'Parking · Pool', price:320, rating:4.6, stays:112 }
  ]
};

/* ============================================================
   STATE
============================================================ */
var $ = function(id){ return document.getElementById(id); };
var state = {
  token: localStorage.getItem('obg_token') || '',
  user: null,
  role: 'customer',
  tab: 'home',
  catalog: null,
  cart: JSON.parse(localStorage.getItem('obg_cart') || '[]'),
  orders: [],
  bookings: [],
  users: null,
  pendingOrder: null,
  apiAlive: false
};

var DELIVERY_FEE = 8;

/* ============================================================
   UTILITIES
============================================================ */
function money(n){ return 'GH\u20B5' + Number(n || 0).toFixed(2); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}
function toast(msg, ms){
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(function(){ t.style.display = 'none'; }, ms || 2400);
}
function openSheet(html){
  $('sheet').innerHTML = html;
  $('modal').classList.add('show');
}
function closeSheet(){ $('modal').classList.remove('show'); }
$('modal').addEventListener('click', function(e){ if (e.target.id === 'modal') closeSheet(); });

function authHeaders(){ return state.token ? { Authorization: 'Bearer ' + state.token } : {}; }
async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type':'application/json' }, authHeaders(), opts.headers || {});
  var r = await fetch('/api' + path, opts);
  var d = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}
async function apiSoft(path, fallback){
  try { return await api(path); } catch(e){ return fallback; }
}

/* ============================================================
   ROLE NAVIGATION
============================================================ */
var TABS = {
  customer: [
    { id:'home', label:'Home', icon:'🏠' },
    { id:'orders', label:'Orders', icon:'🧾' },
    { id:'cart', label:'Cart', icon:'🛒' },
    { id:'bookings', label:'Stays', icon:'🏨' },
    { id:'profile', label:'Account', icon:'👤' }
  ],
  vendor: [
    { id:'home', label:'Dashboard', icon:'📊' },
    { id:'orders', label:'Orders', icon:'🧾' },
    { id:'menu', label:'Menu', icon:'📋' },
    { id:'profile', label:'Account', icon:'👤' }
  ],
  rider: [
    { id:'home', label:'Home', icon:'🏠' },
    { id:'deliveries', label:'Deliveries', icon:'📦' },
    { id:'earnings', label:'Earnings', icon:'💰' },
    { id:'profile', label:'Account', icon:'👤' }
  ],
  hotel: [
    { id:'home', label:'Dashboard', icon:'📊' },
    { id:'bookings', label:'Bookings', icon:'📅' },
    { id:'rooms', label:'Rooms', icon:'🛏️' },
    { id:'profile', label:'Account', icon:'👤' }
  ],
  admin: [
    { id:'home', label:'Dashboard', icon:'📊' },
    { id:'orders', label:'Orders', icon:'🧾' },
    { id:'bookings', label:'Bookings', icon:'📅' },
    { id:'users', label:'Users', icon:'👥' },
    { id:'settings', label:'More', icon:'⚙️' }
  ]
};

function switchRole(role){
  state.role = role;
  state.tab = 'home';
  document.getElementById('roleSelect').value = role;
  // Guests default to customer for vendor/hotel/rider/admin — show "sign in" prompt
  render();
}

function switchTab(tab){
  state.tab = tab;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildNav(){
  var tabs = TABS[state.role] || TABS.customer;
  $('bottomNav').innerHTML = tabs.map(function(t){
    return '<button class="nav-item ' + (t.id === state.tab ? 'active' : '') + '" onclick="switchTab(\'' + t.id + '\')">'
      + '<span class="em">' + t.icon + '</span>' + t.label + '</button>';
  }).join('');
}

/* ============================================================
   MAIN RENDER
============================================================ */
function render(){
  document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
  var target = $('view-' + state.tab);
  if (!target){ state.tab = 'home'; target = $('view-home'); }
  target.classList.add('active');
  buildNav();

  if (state.tab === 'home') renderHome();
  else if (state.tab === 'cart') renderCart();
  else if (state.tab === 'orders') renderOrders();
  else if (state.tab === 'bookings') renderBookings();
  else if (state.tab === 'profile') renderProfile();
  else if (state.tab === 'earnings') renderEarnings();
  else if (state.tab === 'deliveries') renderDeliveries();
  else if (state.tab === 'menu') renderMenuTab();
  else if (state.tab === 'users') renderUsers();
  else if (state.tab === 'settings') renderSettings();
  else if (state.tab === 'rooms') renderRooms();
}

/* ============================================================
   HOME — switches on role
============================================================ */
function renderHome(){
  if (state.role === 'customer') return renderCustomerHome();
  if (state.role === 'vendor') return renderVendorDashboard();
  if (state.role === 'rider') return renderRiderDashboard();
  if (state.role === 'hotel') return renderHotelDashboard();
  if (state.role === 'admin') return renderAdminDashboard();
}

/* ----- CUSTOMER HOME ----- */
function renderCustomerHome(){
  var c = state.catalog || FALLBACK_CATALOG;
  var hero = '<div class="banner"><h3>Good ' + timeOfDay() + ' 👋</h3><p>Discover great food, book hotels, and get things delivered in Obuasi.</p><div class="banner-icon">🏙️</div></div>';
  var cats = '<div class="categories">'
    + '<div class="cat" onclick="toast(\'Browse Food\')"><span class="em">🍔</span><span>Food</span></div>'
    + '<div class="cat" onclick="toast(\'Browse Restaurants\')"><span class="em">🍽️</span><span>Restaurants</span></div>'
    + '<div class="cat" onclick="toast(\'Browse Hotels\')"><span class="em">🏨</span><span>Hotels</span></div>'
    + '<div class="cat" onclick="toast(\'Browse Delivery\')"><span class="em">🛵</span><span>Delivery</span></div>'
    + '</div>';

  var restaurants = '<h3>Popular Near You</h3><div class="cards-scroll">'
    + c.restaurants.map(function(r){
        var minPrice = r.items.reduce(function(m, i){ return i.price < m ? i.price : m; }, r.items[0].price);
        var rating = r.rating || 4.5;
        var orderCount = r.orders || Math.floor(50 + Math.random() * 200);
        return '<div class="card"><div class="card-img">' + r.emoji + '</div><div class="card-body">'
          + '<b>' + esc(r.name) + '</b>'
          + '<div class="stars">⭐ ' + rating.toFixed(1) + ' <small>(' + orderCount + ')</small></div>'
          + '<div class="price-tag">From ' + money(minPrice) + '</div>'
          + '<button class="card-btn" onclick="openRestaurant(\'' + r.id + '\')">View menu</button>'
          + '</div></div>';
      }).join('')
    + '</div>';

  var hotels = '<h3>Hotels &amp; Stays</h3><div class="cards-scroll">'
    + c.hotels.map(function(h){
        var rating = h.rating || 4.5;
        return '<div class="card"><div class="card-img">🏨</div><div class="card-body">'
          + '<b>' + esc(h.name) + '</b>'
          + '<div class="stars">⭐ ' + rating.toFixed(1) + ' <small>' + (h.stays || 100) + ' stays</small></div>'
          + '<div class="price-tag">' + money(h.price) + '/night</div>'
          + '<button class="card-btn" onclick="openBooking(\'' + h.id + '\')">Book room</button>'
          + '</div></div>';
      }).join('')
    + '</div>';

  $('homeContent').innerHTML = hero + cats + restaurants + hotels;
}

function timeOfDay(){
  var h = new Date().getHours();
  if (h < 12) return 'Morning';
  if (h < 17) return 'Afternoon';
  return 'Evening';
}

/* ----- VENDOR DASHBOARD ----- */
async function renderVendorDashboard(){
  var box = $('homeContent');
  if (!isRoleCorrect('vendor')){ box.innerHTML = needsAuth('Vendor'); return; }

  var orders = await apiSoft('/vendor/orders?vendor=' + encodeURIComponent('Obuasi Kitchen'), []);
  var pending = orders.filter(function(o){ return ['Order created','Payment confirmed'].indexOf(o.status) !== -1; }).length;
  var completed = orders.filter(function(o){ return o.status === 'Completed'; }).length;

  var metrics = '<div class="metrics">'
    + '<div class="metric"><b>' + orders.length + '</b><span>Total Orders</span></div>'
    + '<div class="metric"><b>' + pending + '</b><span>Pending</span></div>'
    + '<div class="metric"><b>' + completed + '</b><span>Completed</span></div>'
    + '</div>';

  var warning = '<div style="background:#FFF4E0;color:#7a4b00;padding:10px;border-radius:10px;font-size:12px;font-weight:700;margin-bottom:12px">🔒 You see items purchased — not customer phone numbers or PINs.</div>';

  var recent = '<h3>Recent Orders</h3>';
  if (!orders.length){
    recent += '<div class="order-card"><div class="muted">No incoming orders yet.</div></div>';
  } else {
    recent += orders.slice(0, 8).map(function(o){
      return renderOrderCardForVendor(o);
    }).join('');
  }

  box.innerHTML = metrics + warning + recent;
}

function renderOrderCardForVendor(o){
  var badgeCls = 'badge';
  if (['Food ready','Rider accepted','Rider arrived'].indexOf(o.status) !== -1) badgeCls = 'badge ready';
  if (o.status === 'Completed') badgeCls = 'badge done';
  if (o.status === 'Rejected by vendor' || o.status === 'Cancelled by customer') badgeCls = 'badge red';
  if (o.status === 'Food picked up' || o.status === 'Going to customer') badgeCls = 'badge blue';

  var items = (o.items || []).map(function(i){ return i.qty + '× ' + i.name; }).join(', ');
  var buttons = '';

  if (o.status === 'Order created' || o.status === 'Payment confirmed'){
    buttons = '<div class="order-btns">'
      + '<button class="accept" onclick="vendorAccept(\'' + o.id + '\')">✓ Accept</button>'
      + '<button class="reject" onclick="vendorReject(\'' + o.id + '\')">✕ Reject</button>'
      + '</div>';
  } else if (o.status === 'Restaurant accepted'){
    buttons = '<div class="order-btns">'
      + '<button class="accept" onclick="vendorFoodReady(\'' + o.id + '\')">🍽️ Food ready</button>'
      + '<button class="secondary" onclick="vendorPickupQR(\'' + o.id + '\')">📷 QR</button>'
      + '</div>';
  } else if (o.status === 'Food ready'){
    buttons = '<div class="order-btns"><button class="secondary" onclick="vendorPickupQR(\'' + o.id + '\')">📷 Show pickup QR</button></div>';
  }

  var riderLine = o.rider_phone ? '<div class="muted" style="margin-top:3px">🛵 Rider: ' + esc(o.rider_phone) + '</div>' : '';

  return '<div class="order-card">'
    + '<div class="order-head"><b>#' + esc(o.id) + '</b><span class="' + badgeCls + '">' + esc(o.status) + '</span></div>'
    + '<div class="order-item">' + esc(items) + '</div>'
    + '<div class="order-price">' + money(o.total) + '</div>'
    + riderLine
    + buttons
    + '</div>';
}

/* ============================================================
   AUTH
============================================================ */
function isRoleCorrect(role){
  if (!state.user) return false;
  if (role === 'admin') return ['admin','superadmin'].indexOf(state.user.role) !== -1;
  return state.user.role === role;
}
function needsAuth(roleName){
  return '<div class="order-card" style="text-align:center;padding:28px 18px">'
    + '<div style="font-size:44px;margin-bottom:10px">🔐</div>'
    + '<h3 style="margin:0 0 6px">Sign in to access the ' + esc(roleName) + ' dashboard</h3>'
    + '<p class="muted" style="margin-bottom:14px">Use the phone number linked to your ' + esc(roleName.toLowerCase()) + ' account.</p>'
    + '<button class="btn" onclick="openAuth()">Sign in with OTP</button>'
    + '</div>';
}

function openAuth(){
  openSheet(
    '<div class="close-row"><h2 style="margin:0">Sign in</h2><button class="close-btn" onclick="closeSheet()">×</button></div>'
    + '<p class="muted">We send a one-time code to your phone.</p>'
    + '<label>Phone number</label>'
    + '<input id="authPhone" type="tel" placeholder="+233241234567" value="' + esc(state.user ? state.user.phone : '') + '">'
    + '<button class="btn" id="authSendBtn" onclick="sendOtp()">Send code</button>'
    + '<div id="otpStep" style="display:none;margin-top:12px">'
    + '<label>6-digit code</label>'
    + '<input id="authCode" inputmode="numeric" maxlength="6" placeholder="123456">'
    + '<button class="btn" onclick="verifyOtp()">Verify &amp; sign in</button>'
    + '</div>'
    + '<p class="muted" style="margin-top:14px;text-align:center">Demo numbers: +233241111111 (admin) · +233242222222 (vendor) · +233243333333 (hotel) · +233244444444 (rider)</p>'
  );
}

async function sendOtp(){
  var phone = $('authPhone').value.trim();
  $('authSendBtn').disabled = true;
  try {
    var d = await api('/auth/request-otp', { method:'POST', body: JSON.stringify({ phone: phone }) });
    $('otpStep').style.display = 'block';
    if (d.devOtp){ $('authCode').value = d.devOtp; toast('Dev OTP: ' + d.devOtp, 5000); }
    else toast('Code sent');
  } catch(e){ toast(e.message); }
  $('authSendBtn').disabled = false;
}

async function verifyOtp(){
  var phone = $('authPhone').value.trim();
  var code = $('authCode').value.trim();
  try {
    var d = await api('/auth/verify-otp', { method:'POST', body: JSON.stringify({ phone: phone, code: code }) });
    state.token = d.token; state.user = d.user;
    localStorage.setItem('obg_token', d.token);
    closeSheet();
    renderWho();
    // Auto-jump to the role's dashboard
    if (d.user.role === 'vendor' || d.user.role === 'rider' || d.user.role === 'hotel' || d.user.role === 'admin' || d.user.role === 'superadmin'){
      state.role = (d.user.role === 'superadmin' ? 'admin' : d.user.role);
      state.tab = 'home';
      document.getElementById('roleSelect').value = state.role;
    }
    toast('Welcome ' + (d.user.full_name || d.user.phone));
    render();
  } catch(e){ toast(e.message); }
}

function signOut(){
  state.token = ''; state.user = null;
  localStorage.removeItem('obg_token');
  renderWho();
  toast('Signed out');
  render();
}

function renderWho(){
  $('who').textContent = state.user ? (state.user.full_name || state.user.phone) : 'Guest';
}

/* ============================================================
   RESTAURANT / CART
============================================================ */
function openRestaurant(id){
  var c = state.catalog || FALLBACK_CATALOG;
  var r = c.restaurants.filter(function(x){ return x.id === id; })[0];
  if (!r) return;
  openSheet(
    '<div class="close-row"><h2 style="margin:0">' + esc(r.name) + '</h2><button class="close-btn" onclick="closeSheet()">×</button></div>'
    + '<p class="muted" style="margin-top:-6px">' + esc(r.tags) + ' · ' + esc(r.eta) + '</p>'
    + r.items.map(function(i){
        return '<div class="cart-item"><div class="em">' + i.emoji + '</div>'
          + '<div class="info"><b>' + esc(i.name) + '</b><span>' + money(i.price) + '</span></div>'
          + '<button class="card-btn" style="width:auto;padding:8px 12px;margin:0" onclick="addToCart(\'' + esc(r.name) + '\',\'' + i.id + '\',\'' + esc(i.name) + '\',' + i.price + ',\'' + i.emoji + '\')">+ Add</button>'
          + '</div>';
      }).join('')
    + '<button class="btn" onclick="closeSheet();switchTab(\'cart\')">View cart</button>'
  );
}

function addToCart(vendor, itemId, name, price, emoji){
  var line = null;
  for (var i = 0; i < state.cart.length; i++) if (state.cart[i].vendor === vendor && state.cart[i].itemId === itemId) line = state.cart[i];
  if (line) line.qty++;
  else state.cart.push({ vendor: vendor, itemId: itemId, name: name, price: price, emoji: emoji, qty: 1 });
  saveCart();
  toast(name + ' added');
}
function saveCart(){ localStorage.setItem('obg_cart', JSON.stringify(state.cart)); }

function renderCart(){
  var box = $('cartContent');
  if (!state.cart.length){ box.innerHTML = '<h2>My Cart</h2><div class="empty">Your cart is empty.</div>'; return; }

  var vendors = [];
  state.cart.forEach(function(l){ if (vendors.indexOf(l.vendor) === -1) vendors.push(l.vendor); });
  var sub = state.cart.reduce(function(n, l){ return n + l.qty * l.price; }, 0);
  var fee = DELIVERY_FEE * vendors.length;

  var items = state.cart.map(function(l, i){
    return '<div class="cart-item"><div class="em">' + (l.emoji || '🍽️') + '</div>'
      + '<div class="info"><b>' + esc(l.name) + '</b><span>' + money(l.price) + '</span></div>'
      + '<div class="qty"><button onclick="changeQty(' + i + ',-1)">−</button><b>' + l.qty + '</b><button onclick="changeQty(' + i + ',1)">+</button></div>'
      + '</div>';
  }).join('');

  var summary = '<div class="summary">'
    + '<div class="summary-row"><span>Subtotal</span><b>' + money(sub) + '</b></div>'
    + '<div class="summary-row"><span>Delivery</span><b>' + money(fee) + '</b></div>'
    + '<div class="summary-total"><span>Total</span><span>' + money(sub + fee) + '</span></div>'
    + '</div>';

  box.innerHTML = '<h2>My Cart</h2>' + items + summary
    + '<button class="btn" onclick="placeOrder()">Proceed to Checkout · ' + money(sub + fee) + '</button>'
    + '<button class="btn danger" style="margin-top:8px" onclick="state.cart=[];saveCart();render()">Clear cart</button>';
}

function changeQty(i, d){
  var l = state.cart[i]; if (!l) return;
  l.qty += d;
  if (l.qty <= 0) state.cart.splice(i, 1);
  saveCart(); renderCart();
}

async function placeOrder(){
  if (!state.token){ openAuth(); return; }
  var byVendor = {};
  state.cart.forEach(function(l){ if (!byVendor[l.vendor]) byVendor[l.vendor] = []; byVendor[l.vendor].push(l); });

  // Simple single-vendor cart for now
  var vendor = Object.keys(byVendor)[0];
  var lines = byVendor[vendor];
  var total = lines.reduce(function(n, l){ return n + l.qty * l.price; }, 0) + DELIVERY_FEE;

  openSheet(
    '<div class="close-row"><h2 style="margin:0">Delivery details</h2><button class="close-btn" onclick="closeSheet()">×</button></div>'
    + '<label>Address</label>'
    + '<input id="orderAddr" placeholder="e.g. Ahinsan Estate, House 12, Obuasi">'
    + '<label>Note for rider (optional)</label>'
    + '<input id="orderNote" placeholder="Call when you arrive">'
    + '<button class="btn" onclick="confirmPlaceOrder(\'' + esc(vendor) + '\',' + total + ')">Place order · ' + money(total) + '</button>'
  );
}

async function confirmPlaceOrder(vendor, total){
  var addr = $('orderAddr').value.trim();
  var note = $('orderNote').value.trim();
  if (!addr) return toast('Add a delivery address');
  var lines = state.cart.filter(function(l){ return l.vendor === vendor; });
  try {
    var order = await api('/orders', {
      method:'POST',
      body: JSON.stringify({
        vendor: vendor,
        items: lines.map(function(l){ return { id: l.itemId, name: l.name, price: l.price, qty: l.qty }; }),
        total: total,
        deliveryFee: DELIVERY_FEE,
        deliveryAddress: { text: addr },
        note: note
      })
    });
    state.cart = state.cart.filter(function(l){ return l.vendor !== vendor; });
    saveCart(); closeSheet();
    state.pendingOrder = order;
    showPaymentSheet(order);
  } catch(e){ toast(e.message); }
}

function showPaymentSheet(order){
  openSheet(
    '<div class="close-row"><h2 style="margin:0">Complete payment</h2><button class="close-btn" onclick="closeSheet()">×</button></div>'
    + '<p class="muted">Order #' + order.id + ' · ' + esc(order.vendor) + '</p>'
    + '<div class="summary"><div class="summary-total"><span>Total</span><span>' + money(order.total) + '</span></div></div>'
    + '<button class="btn" onclick="payNow(\'' + order.id + '\')">💳 Pay ' + money(order.total) + ' now</button>'
    + '<button class="btn secondary" onclick="payCash(\'' + order.id + '\')">💵 Cash on delivery</button>'
  );
}

async function payNow(id){
  try { await api('/orders/' + id + '/pay', { method:'POST' }); toast('Payment confirmed 🎉 Vendor notified'); closeSheet(); switchTab('orders'); }
  catch(e){ toast(e.message); }
}
async function payCash(id){
  try { await api('/orders/' + id + '/pay', { method:'POST' }); toast('Order sent (pay on delivery)'); closeSheet(); switchTab('orders'); }
  catch(e){ toast(e.message); }
}

  }
  else if (state.role === 'vendor'){
    var vo = await apiSoft('/vendor/orders?vendor=' + encodeURIComponent('Obuasi Kitchen'), []);

    box.innerHTML = '<h2>Incoming Orders</h2>' + vo.map(renderOrderCardForVendor).join('');
  }
  else if (state.role === 'admin'){
    var ao = await apiSoft('/portal/orders', []);
    if (!ao.length){ box.innerHTML = '<h2>All Orders</h2><div class="empty">No orders yet.</div>'; return; }
    box.innerHTML = '<h2>All Orders (' + ao.length + ')</h2>' + ao.slice(0, 30).map(function(o){

      return '<div class="order-card"><div class="order-head"><b>#' + esc(o.id) + '</b><span class="' + cls + '">' + esc(o.status) + '</span></div>'
        + '<div class="order-item">' + esc(o.vendor) + ' · ' + esc(o.customer_phone) + '</div>'
        + '<div class="order-price">' + money(o.total) + '</div></div>';
    }).join('');
  }
  else {
    box.innerHTML = '<div class="empty">Sign in to see orders.</div>';
  }

function renderCustomerOrderCard(o){
  var cls = o.status === 'Completed' ? 'badge ready' : (o.status === 'Cancelled by customer' || o.status === 'Rejected by vendor' ? 'badge red' : 'badge');
  var canPay = o.status === 'Order created';
  var canCancel = ['Order created','Payment confirmed','Restaurant accepted','Preparing'].indexOf(o.status) !== -1;
  var pinBox = (!/Cancelled|Rejected|Completed/.test(o.status) && o.delivery_pin)
    ? '<div class="summary" style="text-align:center;margin-top:8px"><div style="display:block"><span class="muted" style="font-size:11px">Give this PIN to your rider</span><div style="font-size:22px;letter-spacing:5px;font-weight:900;margin-top:3px">' + esc(o.delivery_pin) + '</div></div></div>'
    : '';
  var buttons = '';
  if (canPay){
    buttons = '<div class="order-btns">'
      + '<button class="accept" onclick="payNow(\'' + o.id + '\')">💳 Pay ' + money(o.total) + '</button>'
      + '<button class="secondary" onclick="payCash(\'' + o.id + '\')">💵 Cash</button>'
      + '</div>';
  }
  if (canCancel){
    buttons += '<div class="order-btns" style="margin-top:6px"><button class="reject" onclick="cancelOrder(\'' + o.id + '\')">✕ Cancel order</button></div>';
  }
  return '<div class="order-card"><div class="order-head"><b>#' + esc(o.id) + '</b><span class="' + cls + '">' + esc(o.status) + '</span></div>'
    + '<div class="order-item">' + esc(o.vendor) + ' · ' + (o.items || []).reduce(function(n, i){ return n + i.qty; }, 0) + ' items</div>'
    + '<div class="order-price">' + money(o.total) + '</div>'
    + pinBox + buttons + '</div>';
}

async function cancelOrder(id){
  if (!confirm('Cancel this order?')) return;
  try { await api('/orders/' + id + '/cancel', { method:'POST' }); toast('Order cancelled'); renderOrders(); }
  catch(e){ toast(e.message); }
}

function openBooking(hotelId){
  var c = state.catalog || FALLBACK_CATALOG;
  var h = c.hotels.filter(function(x){ return x.id === hotelId; })[0];
  if (!h) return;
  var today = new Date().toISOString().slice(0,10);
  var tomorrow = new Date(Date.now() + 86400000).toISOString().slice(0,10);
  openSheet(
    '<div class="close-row"><h2 style="margin:0">Book ' + esc(h.name) + '</h2><button class="close-btn" onclick="closeSheet()">×</button></div>'
    + '<p class="muted" style="margin-top:-4px">' + esc(h.room) + ' · ' + money(h.price) + '/night</p>'
    + '<label>Check-in</label><input type="date" id="bkIn" value="' + today + '">'
    + '<label>Check-out</label><input type="date" id="bkOut" value="' + tomorrow + '">'
    + '<label>Guests</label><select id="bkGuests"><option>1</option><option>2</option><option>3</option><option>4</option></select>'
    + '<button class="btn" onclick="confirmBooking(\'' + h.id + '\')">Confirm booking</button>'
  );
}

async function confirmBooking(hotelId){
  if (!state.token){ openAuth(); return; }
  var c = state.catalog || FALLBACK_CATALOG;
  var h = c.hotels.filter(function(x){ return x.id === hotelId; })[0];
  var ci = $('bkIn').value, co = $('bkOut').value, guests = Number($('bkGuests').value || 1);
  if (!ci || !co) return toast('Choose your dates');
  var nights = Math.max(1, Math.round((new Date(co) - new Date(ci)) / 86400000));
  try {
    await api('/bookings', { method:'POST', body: JSON.stringify({ hotel: h.name, room: h.room, checkIn: ci, checkOut: co, guests: guests, total: h.price * nights }) });
    closeSheet(); toast('Booking confirmed 🎉'); switchTab('bookings');
  } catch(e){ toast(e.message); }
}

async function renderDeliveries(){
  var box = $('deliveriesContent');
  if (!isRoleCorrect('rider')){ box.innerHTML = needsAuth('Rider'); return; }
  var orders = await apiSoft('/rider/assigned', []);
  if (!orders.length){ box.innerHTML = '<h2>Available Deliveries</h2><div class="empty">No deliveries available.</div>'; return; }

  box.innerHTML = '<h2>Available Deliveries</h2>' + orders.map(function(o){
    var mine = o.rider_phone === (state.user && state.user.phone);
    var items = (o.items || []).map(function(i){ return i.qty + '× ' + i.name; }).join(', ');
    var btn = '';
    if (!o.rider_phone && ['Food ready','Restaurant accepted'].indexOf(o.status) !== -1){
      btn = '<div class="order-btns"><button class="accept" onclick="riderAccept(\'' + o.id + '\')">✓ Accept · ' + money(o.rider_commission || 15) + '</button>'
          + '<button class="reject" onclick="riderReject(\'' + o.id + '\')">✕ Skip</button></div>';
    } else if (mine && o.status === 'Rider accepted'){
      btn = '<div class="order-btns"><button class="accept" onclick="riderAction(\'' + o.id + '\',\'rider-arrived\')">📍 Arrived at vendor</button></div>';
    } else if (mine && (o.status === 'Rider arrived' || o.status === 'Food ready')){
      btn = '<div class="order-btns"><button class="accept" onclick="riderAction(\'' + o.id + '\',\'rider-picked-up\')">📦 Picked up food</button></div>';
    } else if (mine && o.status === 'Food picked up'){
      btn = '<div class="order-btns"><button class="accept" onclick="riderAction(\'' + o.id + '\',\'rider-arrived-customer\')">🏠 Arrived at customer</button></div>';
    } else if (mine && o.status === 'Arrived at customer'){
      btn = '<div class="order-btns"><button class="accept" onclick="riderEnterPin(\'' + o.id + '\')">🔑 Enter customer PIN</button></div>';
    }
    var note = o.note ? '<div style="background:#FFF4E0;color:#7a4b00;padding:8px;border-radius:8px;margin-top:6px;font-size:12px"><b>📝 Note:</b> ' + esc(o.note) + '</div>' : '';
    return '<div class="order-card"><div class="order-head"><b>#' + esc(o.id) + '</b><span class="badge ready">+' + money(o.rider_commission || 15) + '</span></div>'
      + '<div class="order-item">' + esc(o.vendor) + '</div>'
      + '<div class="muted" style="margin-top:2px">' + esc(items) + '</div>'
      + note + btn + '</div>';
  }).join('');
}

/* ============================================================
   CHART
============================================================ */
function last7Days(){
  var out = [];
  for (var i = 6; i >= 0; i--){
    var d = new Date(); d.setDate(d.getDate() - i);
    out.push({ day: d.toISOString().slice(0,10), amount: 0, deliveries: 0 });
  }
  return out;
}

function drawChart(series, id){
  var canvas = document.getElementById(id || 'earningsChart');
  if (!canvas) return;
  if (!series || !series.length) series = last7Days();
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  var W = rect.width, H = rect.height;
  var amounts = series.map(function(s){ return Number(s.amount) || 0; });
  var max = Math.max.apply(null, amounts.concat([20]));
  var pad = 22;
  var barW = (W - pad*2) / series.length * 0.6;
  var gap = (W - pad*2) / series.length;
  var labels = series.map(function(s){ return new Date(s.day).toLocaleDateString(undefined, { weekday:'short' }); });

  // grid
  ctx.strokeStyle = '#E7ECE9'; ctx.lineWidth = 1;
  for (var i = 0; i <= 3; i++){
    var y = pad + (H - pad*1.5) * i / 3;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
  }
  // bars
  series.forEach(function(s, i){
    var v = Number(s.amount) || 0;
    var h = (v / max) * (H - pad*1.5);
    var x = pad + i * gap + (gap - barW) / 2;
    var y = H - pad - h;
    ctx.fillStyle = i === series.length - 1 ? '#0B5E3D' : '#C9E3D5';
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, barW, h, 6); else ctx.rect(x, y, barW, h);
    ctx.fill();
    ctx.fillStyle = '#6B7A72'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(labels[i], x + barW/2, H - 6);
  });
}

async function loadCatalog(){
  // Start with fallback so UI is never blank
  state.catalog = FALLBACK_CATALOG;
  // Try real API; if it works, replace
  try {
    var d = await api('/catalog');
    if (d && d.restaurants && d.restaurants.length) {
      state.catalog = d;
      state.apiAlive = true;
    }
  } catch(e){ /* silent — we already have fallback */ }
}

async function loadMe(){
  if (!state.token) return;
  try { var d = await api('/me'); state.user = d.user; renderWho(); }
  catch(e){ state.token = ''; localStorage.removeItem('obg_token'); }
}

async function boot(){
  renderWho();
  await loadCatalog();
  await loadMe();
  render();
  setTimeout(function(){ $('splash').classList.add('hide'); }, 1200);
}

boot();
window.addEventListener('resize', function(){
  if (state.tab === 'home' && state.role === 'rider') renderRiderDashboard();
  if (state.tab === 'earnings') renderEarnings();
});
