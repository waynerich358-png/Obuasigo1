<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ObuasiGo Secure Admin</title><style>body{font-family:system-ui;margin:0;background:#f4f7f5;color:#10231a}.wrap{max-width:1100px;margin:auto;padding:24px}.top{background:#087443;color:#fff;padding:20px;font-weight:800}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 5px 20px #0001;margin:16px 0}button{background:#087443;color:#fff;border:0;padding:12px 16px;border-radius:10px}.danger{background:#a52b2b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.metric{font-size:28px;font-weight:800}</style></head><body><div class="top">ObuasiGo · Secure Admin Portal</div><main class="wrap"><div class="card"><h2>Administrator sign-in</h2><p>Admin access is granted by the server from <code>ADMIN_PHONES</code>. The public app does not contain an Admin role switch.</p><input id="phone" placeholder="Admin phone e.g. +233..." style="padding:12px;width:90%"><button onclick="send()">Send OTP</button><div id="otpbox" style="display:none;margin-top:12px"><input id="otp" maxlength="6" placeholder="6-digit OTP" style="padding:12px"><button onclick="verify()">Verify</button></div></div><div id="dash" style="display:none"><div class="grid" id="metrics"></div><div class="card"><h3>Pending verification documents</h3><pre id="docs">Loading…</pre></div><button class="danger" onclick="logout()">Sign out</button></div></main><script>let phone='',token='';async function send(){phone=document.getElementById('phone').value.trim();const r=await fetch('/api/auth/request-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});const d=await r.json();if(!r.ok)return alert(d.error||'Failed');document.getElementById('otpbox').style.display='block';alert('OTP sent.')}async function verify(){const code=document.getElementById('otp').value.trim();const r=await fetch('/api/auth/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,code})});const d=await r.json();if(!r.ok)return alert(d.error||'Failed');token=d.token;const me=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}}).then(x=>x.json());if(!['admin','superadmin'].includes(me.user?.role))return alert('This number is not an administrator.');document.getElementById('dash').style.display='block';load()}async function load(){const h={Authorization:'Bearer '+token};const o=await fetch('/api/admin/overview',{headers:h}).then(x=>x.json());document.getElementById('metrics').innerHTML=Object.entries(o).map(([k,v])=>`<div class="card"><div>${k}</div><div class="metric">${v}</div></div>`).join('');const d=await fetch('/api/admin/documents',{headers:h}).then(x=>x.json());document.getElementById('docs').textContent=JSON.stringify(d,null,2)}function logout(){token='';location.reload()}</script></body></html>
