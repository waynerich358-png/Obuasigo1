<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ObuasiGo Rider</title>
<style>
:root{--green:#16a05e;--dark:#0e1714;--panel:#18251f;--line:#2b3c34;--muted:#9fb2a8;--gold:#f3a11b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--dark);color:#fff}
.shell{max-width:760px;margin:auto;padding:20px 16px 110px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{font-weight:900;font-size:20px}
.brand span{color:var(--green)}
.dot{width:11px;height:11px;background:#6b766f;border-radius:50%;box-shadow:0 0 0 6px #6b766f22;transition:.2s}
.dot.on{background:#33d17a;box-shadow:0 0 0 6px #33d17a22}
.switch{width:60px;height:33px;border-radius:20px;background:#34463e;padding:4px;border:0;cursor:pointer;transition:.2s;position:relative}
.switch span{display:block;width:25px;height:25px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--green)}
.switch.on span{transform:translateX(27px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h2{margin:8px 0 4px;font-size:19px}
.muted{color:var(--muted);font-size:14px}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#1f8a5633;color:#33d17a;font-size:12px;font-weight:800}
.badge.gold{background:#fff4e033;color:var(--gold)}
.btn{padding:12px 14px;border-radius:11px;font-weight:800;border:0;cursor:pointer;font-size:14px}
.primary{background:var(--green);color:#fff}
.secondary{background:#223029;color:#d9e8e0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.earning{font-size:30px;font-weight:900}
.chart-wrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
canvas#chart{width:100%;height:170px;display:block}
.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#0f1a16;color:#fff;font:inherit;margin:6px 0 12px}
.input:focus{border-color:#33d17a;outline:0}
label{font-size:13px;font-weight:700;color:#c6d4cd;display:block;margin-top:6px}
.hidden{display:none!important}
.order-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.order-id{font-family:monospace;color:#33d17a;font-weight:900}
.comm{font-size:20px;font-weight:900;color:var(--gold)}
.tot{color:#d9e8e0;font-weight:700}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.m{background:#0f1a16;border-radius:12px;padding:12px;text-align:center}
.m b{display:block;font-size:22px;font-weight:900;margin-top:2px;color:#33d17a}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#fff;color:#10231a;padding:12px 16px;border-radius:12px;font-weight:800;display:none;z-index:50;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="dot" id="dot"></div>
    <div>
      <div class="brand">Obuasi<span>Go</span> · Rider</div>
      <div class="muted" id="riderName">Not signed in</div>
    </div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <a href="/scan.html" class="btn secondary" style="text-decoration:none;display:inline-block;padding:9px 12px">📷 Scan</a>
      <button class="switch" id="sw" onclick="toggleOnline()"><span></span></button>
    </div>
  </div>

  <div id="login">
    <div class="card">
      <h2>Rider sign in</h2>
      <p class="muted">Enter your rider phone number to receive an OTP.</p>
      <label>Phone</label>
      <input class="input" id="phone" placeholder="+233241234567" value="+233244444444">
      <button class="btn primary" style="width:100%" onclick="sendOtp()" id="sendBtn">Send code</button>
      <div id="otpStep" class="hidden" style="margin-top:12px">
        <label>6-digit code</label>
        <input class="input" id="code" maxlength="6" inputmode="numeric" placeholder="123456">
        <button class="btn primary" style="width:100%" onclick="verifyOtp()">Verify</button>
      </div>
    </div>
  </div>

  <div id="onlineVerify" class="hidden">
    <div class="card">
      <h2>Verify to go online</h2>
      <p class="muted">A 4-digit code was generated. Enter it to go online.</p>
      <div class="m" style="font-size:34px;letter-spacing:12px;font-weight:900;color:#33d17a;text-align:center" id="codeDisplay">—</div>
      <label>Enter the code</label>
      <input class="input" id="onlineCode" maxlength="4" inputmode="numeric" placeholder="1234">
      <button class="btn primary" style="width:100%" onclick="verifyOnline()">Go online</button>
      <button class="btn secondary" style="width:100%;margin-top:8px" onclick="cancelVerify()">Cancel</button>
    </div>
  </div>

  <div id="app" class="hidden">
    <div class="grid3" id="summary"></div>
    <div class="card">
      <div class="row" style="margin-bottom:6px">
        <b>Assigned orders</b>
        <button class="btn secondary" onclick="loadAssigned()" style="padding:6px 10px;font-size:12px">Refresh</button>
      </div>
      <div id="assignedList"><p class="muted">Loading...</p></div>
    </div>
    <div class="chart-wrap">
      <div class="row" style="margin-bottom:8px">
        <b>Earnings — last 7 days</b>
        <span class="muted" id="total">—</span>
      </div>
      <canvas id="chart"></canvas>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="row">
        <div>
          <div class="muted">Today's earnings</div>
          <div class="earning" id="today">—</div>
          <p class="muted" id="stats">—</p>
        </div>
        <button class="btn secondary" onclick="signOut()">Sign out</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var state = { token:'', user:null, online:false, assigned:[] };
var lastAssignedCount = 0;

function money(n){ return 'GH\u20B5' + Number(n || 0).toFixed(2); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
  });
}
function toast(m, ms){
  var t = $('toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(function(){ t.style.display = 'none'; }, ms || 2400);
}
function authHeaders(){ return state.token ? { Authorization: 'Bearer ' + state.token } : {}; }
async function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type':'application/json' }, authHeaders(), opts.headers || {});
  var r = await fetch('/api' + path, opts);
  var d = await r.json().catch(function(){ return {}; });
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}
function playBeep(){
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    osc.frequency.value = 880;
    osc.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.2);
  } catch(e){}
}

async function sendOtp(){
  var phone = $('phone').value.trim();
  $('sendBtn').disabled = true;
  try {
    var d = await api('/auth/request-otp', { method:'POST', body: JSON.stringify({ phone: phone }) });
    $('otpStep').classList.remove('hidden');
    if (d.devOtp){ $('code').value = d.devOtp; toast('Dev OTP: ' + d.devOtp, 5000); }
    else toast('Code sent');
  } catch(e){ toast(e.message); }
  $('sendBtn').disabled = false;
}

async function verifyOtp(){
  var phone = $('phone').value.trim(); var code = $('code').value.trim();
  try {
    var d = await api('/auth/verify-otp', { method:'POST', body: JSON.stringify({ phone: phone, code: code }) });
    state.token = d.token; state.user = d.user;
    localStorage.setItem('obg_rider_token', d.token);
    if (['rider','admin','superadmin'].indexOf(d.user.role) === -1){ toast('Not a rider account (' + d.user.role + ')'); return; }
    enterApp();
  } catch(e){ toast(e.message); }
}

function enterApp(){
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('riderName').textContent = state.user.full_name || state.user.phone;
  loadSummary(); loadAssigned(); loadEarnings();
  startPolling();
}

function startPolling(){
  if (window._riderPoll) clearInterval(window._riderPoll);
  window._riderPoll = setInterval(function(){
    if (!state.token || !state.user) return;
    if ($('app').classList.contains('hidden')) return;
    loadAssigned(); loadSummary();
  }, 5000);
}

function signOut(){
  state.token = ''; state.user = null;
  if (window._riderPoll) clearInterval(window._riderPoll);
  localStorage.removeItem('obg_rider_token');
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
}

async function toggleOnline(){
  if (!state.online){
    try {
      var r = await api('/rider/online', { method:'POST' });
      $('codeDisplay').textContent = r.code || '—';
      $('onlineVerify').classList.remove('hidden');
      $('app').classList.add('hidden');
    } catch(e){ toast(e.message); }
    return;
  }
  state.online = false;
  $('sw').classList.remove('on'); $('dot').classList.remove('on');
  toast('You are offline');
}

async function verifyOnline(){
  var code = $('onlineCode').value.trim();
  try {
    await api('/rider/verify-online', { method:'POST', body: JSON.stringify({ code: code }) });
    state.online = true;
    $('sw').classList.add('on'); $('dot').classList.add('on');
    $('onlineVerify').classList.add('hidden'); $('app').classList.remove('hidden');
    toast('You are online ✓');
    loadAssigned();
  } catch(e){ toast(e.message); }
}
function cancelVerify(){ $('onlineVerify').classList.add('hidden'); $('app').classList.remove('hidden'); }

async function loadAssigned(){
  try {
    state.assigned = await api('/rider/assigned');
    if (state.assigned.length > lastAssignedCount && lastAssignedCount > 0) playBeep();
    lastAssignedCount = state.assigned.length;
    renderAssigned();
  } catch(e){ $('assignedList').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; }
}

function renderAssigned(){
  var box = $('assignedList');
  if (!state.assigned.length){ box.innerHTML = '<p class="muted">No active orders right now.</p>'; return; }
  box.innerHTML = state.assigned.map(function(o){
    var s = o.status;
    var items = (o.items || []).map(function(i){ return i.qty + '× ' + i.name; }).join(', ');
    var mine = o.rider_phone === state.user.phone;
    var btn = '';
    if (!o.rider_phone && ['Food ready','Restaurant accepted'].indexOf(s) !== -1){
      btn = '<button class="btn primary" style="width:100%;margin-top:10px" onclick="acceptOrder(\'' + esc(o.id) + '\')">✓ Accept · earn ' + money(15) + '</button>'
          + '<button class="btn secondary" style="width:100%;margin-top:8px" onclick="rejectOrder(\'' + esc(o.id) + '\')">✕ Skip this order</button>';
    } else if (mine && s === 'Rider accepted'){
      btn = '<button class="btn primary" style="width:100%;margin-top:10px" onclick="riderAction(\'' + esc(o.id) + '\',\'rider-arrived\')">📍 I arrived at vendor</button>';
    } else if (mine && (s === 'Rider arrived' || s === 'Food ready')){
      btn = '<button class="btn primary" style="width:100%;margin-top:10px" onclick="riderAction(\'' + esc(o.id) + '\',\'rider-picked-up\')">📦 I picked up food</button>';
    } else if (mine && s === 'Food picked up'){
      btn = '<button class="btn primary" style="width:100%;margin-top:10px" onclick="riderAction(\'' + esc(o.id) + '\',\'rider-arrived-customer\')">🏠 I arrived at customer</button>';
    } else if (mine && s === 'Arrived at customer'){
      btn = '<button class="btn primary" style="width:100%;margin-top:10px" onclick="promptDeliveryPin(\'' + esc(o.id) + '\')">🔑 Enter customer PIN</button>';
    }
    var noteHtml = o.note ? '<div style="background:#2b1f0f;border:1px solid #f3a11b;border-radius:10px;padding:10px;margin:8px 0;color:#f3a11b;font-size:13px"><b>📝 Note from customer:</b> ' + esc(o.note) + '</div>' : '';
    return '<div class="order-card">'
      + '<div class="row"><span class="order-id">#' + esc(o.id) + '</span><span class="badge gold">' + esc(s) + '</span></div>'
      + '<div class="muted" style="margin:6px 0">' + esc(o.vendor) + ' → ' + esc((o.delivery_address && o.delivery_address.text) || 'customer') + '</div>'
      + '<div class="muted" style="margin-bottom:8px">' + esc(items) + '</div>'
      + noteHtml
      + '<div class="row"><span class="tot">' + money(o.total) + '</span><span class="comm">+' + money(o.rider_commission || 15) + '</span></div>'
      + btn + '</div>';
  }).join('');
}

async function acceptOrder(id){
  var commission = Number(prompt('Commission for this order (GH\u20B5):', '15'));
  if (!commission || commission <= 0) return;
  try {
    await api('/rider/orders/' + id + '/accept', { method:'POST', body: JSON.stringify({ commission: commission }) });
    toast('Order accepted'); loadAssigned(); loadSummary();
  } catch(e){ toast(e.message); }
}

async function rejectOrder(id){
  if (!confirm('Skip this delivery?')) return;
  try {
    await api('/rider/orders/' + id + '/reject', { method:'POST' });
    toast('Order skipped'); loadAssigned();
  } catch(e){ toast(e.message); }
}

async function riderAction(id, action){
  try {
    await api('/orders/' + id + '/' + action, { method:'POST' });
    toast('Updated'); loadAssigned();
  } catch(e){ toast(e.message); }
}

async function promptDeliveryPin(id){
  var pin = prompt('Enter the 4-digit PIN from the customer:');
  if (!pin) return;
  try {
    var r = await api('/orders/' + id + '/verify-delivery', { method:'POST', body: JSON.stringify({ pin: pin }) });
    toast('Delivered! +' + money(r.commission) + ' earned 🎉');
    loadAssigned(); loadSummary(); loadEarnings();
  } catch(e){ toast(e.message); }
}

async function loadSummary(){
  try {
    var s = await api('/rider/summary');
    $('summary').innerHTML =
      '<div class="m">Assigned<b>' + s.assigned + '</b></div>'
      + '<div class="m">Completed<b>' + s.completed + '</b></div>'
      + '<div class="m">Earned<b>' + money(s.earnings) + '</b></div>';
  } catch(e){}
}

async function loadEarnings(){
  try {
    var e = await api('/rider/earnings');
    $('total').textContent = 'Total ' + money(e.total);
    $('today').textContent = money(e.today);
    $('stats').textContent = e.series.reduce(function(n, s){ return n + s.deliveries; }, 0) + ' deliveries · 4.9★';
    drawChart(e.series);
  } catch(e){}
}

function drawChart(series){
  var c = $('chart');
  var dpr = window.devicePixelRatio || 1;
  var rect = c.getBoundingClientRect();
  c.width = rect.width * dpr; c.height = 170 * dpr;
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var W = rect.width, H = 170, pad = 22;
  var labels = series.map(function(s){ return new Date(s.day).toLocaleDateString(undefined, { weekday:'short' }); });
  var values = series.map(function(s){ return s.amount; });
  var max = Math.max.apply(null, values.concat([20])) * 1.2;
  var gap = 8;
  var bw = (W - pad * 2 - gap * (values.length - 1)) / values.length;
  ctx.strokeStyle = '#223029'; ctx.lineWidth = 1;
  for (var i = 0; i <= 4; i++){
    var y = pad + (H - pad * 2) * i / 4;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
  }
  var todayIdx = values.length - 1;
  values.forEach(function(v, i){
    var h = (v / max) * (H - pad * 2);
    var x = pad + i * (bw + gap);
    var y = H - pad - h;
    ctx.fillStyle = i === todayIdx ? '#33d17a' : '#1f8a56';
    ctx.beginPath(); ctx.rect(x, y, bw, h); ctx.fill();
    ctx.fillStyle = '#9fb2a8'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(labels[i], x + bw / 2, H - 6);
    ctx.fillStyle = '#d9e8e0'; ctx.font = 'bold 11px system-ui';
    ctx.fillText('\u20B5' + Math.round(v), x + bw / 2, y - 5);
  });
}
window.addEventListener('resize', function(){ if (state.token) loadEarnings(); });

(function(){
  var t = localStorage.getItem('obg_rider_token');
  if (!t) return;
  state.token = t;
  api('/me').then(function(d){
    state.user = d.user;
    if (['rider','admin','superadmin'].indexOf(d.user.role) !== -1) enterApp();
    else signOut();
  }).catch(function(){ signOut(); });
})();
</script>
</body>
</html>
