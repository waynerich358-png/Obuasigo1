<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ObuasiGo Rider Portal</title><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/launch.css"><link rel="icon" href="/favicon-512.png"></head><body><header class="top"><div class="brand"><img src="/obuasigo-icon.webp" alt="ObuasiGo logo"><b>Obuasi<span>Go</span> Rider</b></div><div class="row"><span id="userLabel"></span><button class="light" onclick="logout()">Logout</button></div></header><main class="wrap"><div class="hero"><h1>Rider Dashboard</h1><p>Separate rider workspace for deliveries, earnings, customer location and feedback.</p></div><div id="msg" class="notice hidden"></div><section id="login" class="card login"><h2>Rider sign in</h2><label>Phone number</label><input id="phone" placeholder="+233241234567"><button onclick="requestOtp()">Send OTP</button><div id="otpBox" class="hidden"><label>6-digit OTP</label><input id="otp"><button class="gold" onclick="verifyOtp()">Verify & continue</button><div id="devOtp"></div></div></section><section id="apply" class="card hidden"><h2>Register as a rider</h2><form id="applyForm"><label>Full name</label><input name="full_name" required><label>Ghana Card number</label><input name="ghana_card_number" required><label>Rider/Driver licence number</label><input name="license_number" required><label>Vehicle type</label><select name="vehicle_type"><option>Motorcycle</option><option>Car</option><option>Van</option></select><label>Plate number</label><input name="plate_number" required><label>Address</label><input name="address"><label>Emergency phone</label><input name="emergency_phone"><label>Email</label><input name="email" type="email"><button class="gold">Submit rider application</button></form><div class="grid2"><div><label>Ghana Card</label><input type="file" accept="image/*,.pdf" onchange="uploadDoc('ghana_card',this.files[0])"></div><div><label>Driver/rider licence</label><input type="file" accept="image/*,.pdf" onchange="uploadDoc('driver_license',this.files[0])"></div><div><label>Vehicle registration</label><input type="file" accept="image/*,.pdf" onchange="uploadDoc('vehicle_registration',this.files[0])"></div><div><label>Vehicle insurance</label><input type="file" accept="image/*,.pdf" onchange="uploadDoc('vehicle_insurance',this.files[0])"></div></div></section><section id="dashboard" class="hidden"><div class="grid"><div class="card"><div class="muted">Today's earnings</div><div class="stat" id="earnings">GH₵0.00</div></div><div class="card"><div class="muted">Deliveries</div><div class="stat" id="deliveries">0</div></div><div class="card"><div class="muted">Rating</div><div class="stat" id="rating">—</div></div><div class="card"><div class="muted">Status</div><div class="stat">Online</div></div></div><div class="grid2"><div class="card"><h2>My deliveries</h2><div id="deliveryList" class="list"></div></div><div class="card"><h2>Customer feedback</h2><div id="feedback" class="list"></div></div></div></section></main><script src="/portal.js"></script><script>
async function submitApply(e){e.preventDefault();const body=Object.fromEntries(new FormData(e.target).entries());body.requested_role='rider';const r=await api('/api/partner/apply',{method:'POST',body:JSON.stringify(body)});msg(r.ok?r.data.message:(r.data.error||'Application failed'),!r.ok)}
async function loadRider(){const me=await loadMe();renderHeader('rider');if(!me){show('login');return}show('login',false);if(currentUser.role!=='rider'){show('apply');return}const r=await api('/api/rider/dashboard');if(!r.ok){show('apply');return}show('dashboard');$('earnings').textContent='GH₵'+Number(r.data.summary?.today||0).toFixed(2);$('deliveries').textContent=r.data.summary?.deliveries||0;$('rating').textContent=r.data.summary?.averageRating?Number(r.data.summary.averageRating).toFixed(1)+'★':'—';$('deliveryList').innerHTML=(r.data.orders||[]).map(o=>`<div class="item"><b>${esc(o.id)}</b><br>${esc(o.vendor||'Vendor')} — GH₵${Number(o.total).toFixed(2)}<br><span class="pill">${esc(o.status)}</span>${o.delivery_address?'<br>📍 '+esc(o.delivery_address):''}<div class="actions" style="margin-top:8px"><button onclick="updateDelivery('${o.id}','Going to customer')">Going to customer</button><button class="gold" onclick="updateDelivery('${o.id}','Completed')">Completed</button></div></div>`).join('')||'No deliveries assigned yet.';$('feedback').innerHTML=(r.data.feedback||[]).map(f=>`<div class="item"><b>${'★'.repeat(f.rating)}${'☆'.repeat(5-f.rating)}</b><br>${esc(f.comment||'No comment')}</div>`).join('')||'No feedback yet.'}
async function updateDelivery(id,status){const r=await api('/api/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});msg(r.ok?'Delivery updated':(r.data.error||'Update failed'),!r.ok);loadRider()}
$('applyForm').addEventListener('submit',submitApply);loadRider();</script><script src="/launch.js"></script></body></html>
