<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ObuasiGo Admin Access Request</title><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/launch.css"><link rel="icon" href="/favicon-512.png"></head><body><header class="top"><div class="brand"><img src="/obuasigo-icon.webp" alt="ObuasiGo logo"><b>Obuasi<span>Go</span> Admin Access</b></div><a class="btn light" href="/admin">Back to Admin</a></header><main class="wrap"><section class="card login"><h1>Request administrator access</h1><p class="muted">Sign in first, then submit your identity and reason. Jessica reviews all administrator requests.</p><div id="msg" class="notice hidden"></div><div id="login"><label>Phone number</label><input id="phone" placeholder="+233241234567"><button onclick="requestOtp()">Send OTP</button><div id="otpBox" class="hidden"><label>OTP</label><input id="otp"><button class="gold" onclick="verifyOtp()">Verify</button><div id="devOtp"></div></div></div><form id="request" class="hidden"><label>Full name</label><input name="full_name" required><label>Ghana Card number</label><input name="ghana_card_number" required><label>Reason for admin access</label><textarea name="reason" required></textarea><button class="gold">Submit request</button></form><div id="docs" class="hidden"><label>Ghana Card document</label><input type="file" accept="image/*,.pdf" onchange="uploadDoc('ghana_card',this.files[0])"><label>Supporting identity document</label><input type="file" accept="image/*,.pdf" onchange="uploadDoc('identity',this.files[0])"></div></section></main><script src="/portal.js"></script><script>async function init(){const me=await loadMe();if(me){show('login',false);show('request');show('docs')}}init();$('request').addEventListener('submit',async e=>{e.preventDefault();const r=await api('/api/admin/access-request',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target).entries()))});msg(r.ok?'Request sent to Jessica':(r.data.error||'Request failed'),!r.ok);if(r.ok)e.target.reset()});</script><script src="/launch.js"></script></body></html>
